name: Hochwasser-Alarm

on:
  schedule:
    - cron: '*/15 * * * *'    # alle 15 Minuten
  workflow_dispatch:
    inputs:
      test:
        description: 'Nur Testnachricht senden'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alarm
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pegel prüfen
        env:
          TEST: ${{ inputs.test }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node .github/scripts/alarm.mjs
      - name: Status speichern
        run: |
          if [ -n "$(git status --porcelain alarm-status.json)" ]; then
            git config user.name "pegel-alarm"
            git config user.email "pegel-alarm@users.noreply.github.com"
            git add alarm-status.json
            git commit -m "Alarmstatus aktualisiert"
            git push
          fi
